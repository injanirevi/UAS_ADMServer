name: CI/CD - Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: reviinjani
  REGISTRY: docker.io

jobs:
  # Job 1: Build and Push web-dinamis
  build-dinamis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web-dinamis
        uses: docker/build-push-action@v5
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/uas_dinamis_2388010009:latest
            ${{ env.DOCKERHUB_USERNAME }}/uas_dinamis_2388010009:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/uas_dinamis_2388010009:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/uas_dinamis_2388010009:buildcache,mode=max

  # Job 2: Build and Push web_statis
  build-statis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web_statis
        uses: docker/build-push-action@v5
        with:
          context: ./web_statis
          file: ./web_statis/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/uas_statis_2388010009:latest
            ${{ env.DOCKERHUB_USERNAME }}/uas_statis_2388010009:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/uas_statis_2388010009:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/uas_statis_2388010009:buildcache,mode=max

  # Job 3: Deploy to AWS EC2
  deploy:
    needs: [build-dinamis, build-statis]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to AWS EC2
        run: |
          ssh -i ~/.ssh/aws_key.pem ubuntu@${{ secrets.AWS_EC2_HOST }} << 'DEPLOY_SCRIPT'
          
          # Update system
          sudo apt-get update -y
          
          # Check Docker is running
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          # Create app directory
          mkdir -p ~/uas-app
          cd ~/uas-app
          
          # Download docker-compose file from GitHub
          curl -fsSL https://raw.githubusercontent.com/injanirevi/UAS_ADMServer/main/docker-compose.prod.yml -o docker-compose.yml
          
          # Create .env file with production values
          cat > .env << 'EOF'
          DOCKERHUB_USERNAME=reviinjani
          DB_USER=userwebdinamis
          DB_PASSWORD=
          DB_NAME=dbcompro_2388010027
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          EOF
          
          # Pull latest images
          docker-compose pull
          
          # Stop old containers and remove volumes to reset MariaDB state
          docker-compose down -v || true
          
          # Start new containers
          docker-compose up -d
          
          # Verify containers are running
          docker-compose ps
          
          echo "✓ Deployment completed successfully!"
          echo "Web Static: http://13.229.108.94"
          echo "Web Dynamic: http://13.229.108.94:3000"
          
          DEPLOY_SCRIPT

      - name: Deployment status
        if: success()
        run: |
          echo "✓ CI/CD Pipeline completed!"
          echo "✓ Images pushed to DockerHub"
          echo "✓ Deployed to AWS EC2 (13.229.108.94)"
          echo ""
          echo "Access your applications:"
          echo "- Static Site: http://13.229.108.94"
          echo "- Dynamic App: http://13.229.108.94:3000"

      - name: Deployment failed
        if: failure()
        run: |
          echo "✗ Deployment failed!"
          echo "Check the logs above for details."
