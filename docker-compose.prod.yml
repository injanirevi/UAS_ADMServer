version: '3.8'

services:
  # Web Static (Nginx) - Port 80
  web-statis:
    image: ${DOCKERHUB_USERNAME}/uas_statis_2388010009:latest
    container_name: uas-web-statis
    ports:
      - "80:80"
    restart: always
    networks:
      - uas-network
    environment:
      - NODE_ENV=production

  # Web Dynamic (Next.js) - Port 3000
  web-dinamis:
    image: ${DOCKERHUB_USERNAME}/uas_dinamis_2388010009:latest
    container_name: uas-web-dinamis
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - db-webdinamis
    networks:
      - uas-network
    environment:
      - NODE_ENV=production
      - DB_USER=${DB_USER:-userwebdinamis}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-dbcompro_2388010027}
      - DB_HOST=db-webdinamis
      - DB_PORT=3306
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key-change-me}
      - NEXTAUTH_URL=http://13.229.108.94:3000

  # Database (MariaDB)
  db-webdinamis:
    image: mariadb:lts
    container_name: uas-db
    restart: always
    networks:
      - uas-network
    environment:
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes
      - MARIADB_ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_DATABASE=${DB_NAME:-dbcompro_2388010027}
      - MARIADB_USER=${DB_USER:-userwebdinamis}
      - MARIADB_PASSWORD=${DB_PASSWORD:-}

networks:
  uas-network:
    driver: bridge
